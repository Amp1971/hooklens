<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
  </defs>

  <!-- Icon: Hook + Lens Focus -->
  <g transform="translate(10, 10)">
    <!-- Outer Focus Ring -->
    <circle cx="40" cy="40" r="36" stroke="url(#hookGrad)" stroke-width="3.5" stroke-dasharray="8 4" opacity="0.4" />
    
    <!-- Lens Iris / Glow -->
    <circle cx="40" cy="40" r="28" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
    
    <!-- Webhook Hook Shape -->
    <path d="M28 46 C28 32, 44 26, 50 34 C55 41, 46 52, 38 52 C34 52, 34 46, 38 44 C42 42, 45 45, 45 47" 
          stroke="url(#hookGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Central AI Pulse / Target Dot -->
    <circle cx="40" cy="40" r="4.5" fill="#38BDF8" />
  </g>

  <!-- Typography: HookLens -->
  <text x="105" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="36" letter-spacing="-0.5">
    Hook<tspan fill="url(#hookGrad)">Lens</tspan>
  </text>
  <text x="106" y="76" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" letter-spacing="1.5">
    WEBHOOK INTELLIGENCE
  </text>
</svg>
